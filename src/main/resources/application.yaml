server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: help-countryside
  profiles:
    # 本地开发默认走 dev，敏感配置放在 application-dev.yaml（不入库）
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # TODO 服务间存在循环依赖，后续应拆分，暂时保留该开关
  main:
    allow-circular-references: true
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 200MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:helpcountryside}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s

# 腾讯云对象存储
tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    bucket-name: ${TENCENT_COS_BUCKET_NAME:}
    region: ${TENCENT_COS_REGION:ap-shanghai}
    url: ${TENCENT_COS_URL:}

# 阿里云短信
aliyun:
  sms:
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}

# 第三方植物识别接口
plant:
  api:
    app-code: ${PLANT_API_APP_CODE:}
